<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" fill="#12B866">
  <!-- Morubi — marca única. Mantida em sincronia com src/logo.tsx (mesmas coordenadas). -->
  <defs>
    <g id="morubi-side">
      <!-- Aresta em escada: forma a diagonal da pirâmide -->
      <path d="M38 548 L38 484 L86 484 L86 420 L134 420 L134 356 L182 356 L182 322"
            fill="none" stroke="#12B866" stroke-width="17" stroke-linejoin="miter" stroke-linecap="butt"/>
      <!-- Grega em espiral dentro da asa -->
      <path d="M112 548 L112 466 L242 466 L242 548 L212 548 L212 506 L156 506 L156 548"
            fill="none" stroke="#12B866" stroke-width="17" stroke-linejoin="miter" stroke-linecap="butt"/>
      <!-- Escadinha de pontos continuando a diagonal até o losango -->
      <rect x="198" y="292" width="19" height="19"/>
      <circle cx="240" cy="272" r="9"/>
    </g>
  </defs>

  <!-- Losango pequeno do topo -->
  <path d="M350 146 L392 190 L350 234 L308 190 Z M350 172 L368 190 L350 208 L332 190 Z" fill-rule="evenodd"/>
  <rect x="342" y="228" width="16" height="26"/>
  <!-- Losango central -->
  <path d="M350 246 L442 320 L350 400 L258 320 Z M350 286 L400 320 L350 358 L300 320 Z" fill-rule="evenodd"/>
  <circle cx="350" cy="320" r="25"/>

  <!-- "M" central: hastes verticais + V, começando abaixo do losango -->
  <path d="M258 548 L258 390 L350 442 L442 390 L442 548"
        fill="none" stroke="#12B866" stroke-width="30" stroke-linejoin="miter" stroke-linecap="butt"/>
  <!-- Galho inferior, aninhado sob o V (sem encostar nele) -->
  <path d="M306 548 L350 500 L394 548"
        fill="none" stroke="#12B866" stroke-width="16" stroke-linejoin="miter" stroke-linecap="butt"/>

  <use href="#morubi-side"/>
  <use href="#morubi-side" transform="translate(700,0) scale(-1,1)"/>
</svg>
